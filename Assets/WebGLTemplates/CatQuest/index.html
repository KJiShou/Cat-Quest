<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #edf7fb; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 40% 10% auto; text-align: center; color: #234e7d; font: 18px/1.5 sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Cat Quest"></canvas>
  <div id="status" role="status">Loading Cat Quest…</div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const status = document.getElementById('status');
    async function start() {
      try {
        // A single owner prevents two tabs from settling against the same local save.
        if (!navigator.locks) throw new Error('Use a current desktop browser over HTTPS to play Cat Quest.');
        await navigator.locks.request('catquest-player', { ifAvailable: true }, async lock => {
          if (!lock) throw new Error('Cat Quest is already open in another tab. Close it, then reload this page.');
          const instance = await createUnityInstance(document.getElementById('unity-canvas'), {
            dataUrl: 'Build/{{{ DATA_FILENAME }}}',
            frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
            codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if SYMBOLS_FILENAME
            symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
            streamingAssetsUrl: 'StreamingAssets',
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
            showBanner: (message, type) => { if (type === 'error') { status.hidden = false; status.textContent = message; } }
          }, progress => { status.textContent = 'Loading Cat Quest… ' + Math.round(progress * 100) + '%'; });
          status.hidden = true;
          // Keep the lock until this document is closed. No cross-tab state authority.
          await new Promise(() => {});
        });
      } catch (error) { status.hidden = false; status.textContent = error.message || String(error); }
    }
    start();
  </script>
</body>
</html>
